<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <style>
      .red   { fill:#E1392E; }
      .wht   { fill:#ffffff; }
      .word  { font-family:'Pacifico',cursive; }
      .tag   { font-family:'Arial Black',Arial,sans-serif; font-weight:900; }
    </style>
  </defs>

  <!-- Palette -->
  <g>
    <ellipse cx="78" cy="118" rx="62" ry="46" fill="#2b2b2b"/>
    <ellipse cx="78" cy="118" rx="54" ry="38" fill="#3a3a3a"/>
    <!-- thumb hole -->
    <ellipse cx="108" cy="132" rx="14" ry="11" fill="#2b2b2b"/>
    <!-- paint dots -->
    <circle cx="58"  cy="88"  r="9" fill="#f4d03f"/>
    <circle cx="40"  cy="112" r="9" fill="#e74c6f"/>
    <circle cx="46"  cy="140" r="9" fill="#27ae60"/>
    <circle cx="74"  cy="150" r="9" fill="#2e86de"/>
    <circle cx="100" cy="96"  r="8" fill="#ffffff"/>
    <circle cx="118" cy="118" r="7" fill="#1a1a1a"/>
  </g>

  <!-- Wordmark with white outline (drawn twice: thick white behind, red on top) -->
  <text x="165" y="148" class="word wht" font-size="138" stroke="#ffffff" stroke-width="15" stroke-linejoin="round">Galeria</text>
  <text x="165" y="148" class="word red" font-size="138">Galeria</text>

  <!-- underline swoosh -->
  <path d="M165 182 Q415 172 690 180" stroke="#E1392E" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- ART & MORE tag -->
  <text x="770" y="96"  class="tag red" font-size="38">ART &amp;</text>
  <text x="770" y="142" class="tag red" font-size="38">MORE</text>
</svg>
